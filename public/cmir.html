<html>
<head>
	<title>Connect more in real</title>
</head>
<body>
	<div id="fb-root"></div>
	<script>
  window.fbAsyncInit = function() {
    FB.init({
      appId               : '250528246214792', // Facebook Application ID
      autoLogAppEvents    : true,
      cookie              : true,
      xfbml               : true,
      version             : 'v7.0'
    });
      
    FB.AppEvents.logPageView();   
  };

  (function(d, s, id){
     var js, fjs = d.getElementsByTagName(s)[0];
     if (d.getElementById(id)) {return;}
     js = d.createElement(s); js.id = id;
     js.src = "https://connect.facebook.net/en_US/sdk.js";
     fjs.parentNode.insertBefore(js, fjs);
   }(document, 'script', 'facebook-jssdk'));

	function checkLoginState() {
		FB.getLoginStatus(function(response) {
			StatusChangeCallback(response);
		});
	}

	function StatusChangeCallback(response) {
		console.log(response);
	}

	</script>  

	<div class="fb-login-button" data-size="large" data-button-type="continue_with" data-layout="rounded" data-auto-logout-link="false" data-use-continue-as="false" data-width="" scope="public_profile,email" 
    onlogin="checkLoginState();"></div>

	<!-- 
	<fb:login-button scope="public_profile,email" 
		onlogin="checkLoginState();">
	</fb:login-button>
	-->
</body>
</html>
