<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .mode-selection {
            margin-bottom: 20px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button.selected {
            background-color: #2980b9;
            font-weight: bold;
        }
        
        button.restart {
            background-color: #e74c3c;
        }
        
        button.restart:hover {
            background-color: #c0392b;
        }

        .difficulty-selection {
            margin-top: 10px;
            margin-bottom: 15px;
            display: none;
        }
        
        .status {
            margin: 10px 0;
            font-size: 18px;
            height: 25px;
            font-weight: bold;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            margin: 20px auto;
            width: 300px;
            height: 300px;
        }
        
        .cell {
            background-color: #ecf0f1;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        
        .cell:hover {
            background-color: #d0d3d4;
        }
        
        .cell.x {
            color: #e74c3c;
        }
        
        .cell.o {
            color: #3498db;
        }
        
        .winning {
            background-color: #2ecc71;
            color: white !important;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 15px auto;
            width: 300px;
            font-size: 16px;
        }
        
        .score {
            padding: 10px;
            border-radius: 5px;
            background-color: #ecf0f1;
            width: 80px;
        }
        
        .player-x {
            color: #e74c3c;
        }
        
        .player-o {
            color: #3498db;
        }
        
        .turn-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
        }
        
        .turn-x {
            background-color: #e74c3c;
        }
        
        .turn-o {
            background-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        
        <div class="mode-selection">
            <p>Select Game Mode:</p>
            <button id="vs-computer" class="mode-btn selected">vs Computer</button>
            <button id="vs-human" class="mode-btn">vs Human</button>
        </div>
        
        <div class="difficulty-selection" id="difficulty">
            <p>Select Difficulty:</p>
            <button id="easy" class="difficulty-btn selected">Easy</button>
            <button id="medium" class="difficulty-btn">Medium</button>
            <button id="hard" class="difficulty-btn">Hard</button>
        </div>
        
        <div class="score-board">
            <div class="score player-x">
                X: <span id="score-x">0</span>
            </div>
            <div class="score">
                Ties: <span id="score-ties">0</span>
            </div>
            <div class="score player-o">
                O: <span id="score-o">0</span>
            </div>
        </div>
        
        <div class="status" id="status">X's turn <span class="turn-indicator turn-x"></span></div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <button id="restart" class="restart">Restart Game</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Game state
            const gameState = {
                currentPlayer: 'x',
                board: Array(9).fill(''),
                vsComputer: true,
                difficulty: 'easy',
                gameOver: false,
                scores: {
                    x: 0,
                    o: 0,
                    ties: 0
                }
            };

            // DOM elements
            const board = document.getElementById('board');
            const cells = document.querySelectorAll('.cell');
            const status = document.getElementById('status');
            const vsComputerBtn = document.getElementById('vs-computer');
            const vsHumanBtn = document.getElementById('vs-human');
            const difficultyDiv = document.getElementById('difficulty');
            const easyBtn = document.getElementById('easy');
            const mediumBtn = document.getElementById('medium');
            const hardBtn = document.getElementById('hard');
            const restartBtn = document.getElementById('restart');
            const scoreX = document.getElementById('score-x');
            const scoreO = document.getElementById('score-o');
            const scoreTies = document.getElementById('score-ties');

            // Winning patterns
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                [0, 4, 8], [2, 4, 6]             // Diagonals
            ];

            // Initialize the game
            function initGame() {
                gameState.board = Array(9).fill('');
                gameState.currentPlayer = 'x';
                gameState.gameOver = false;
                
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.classList.remove('x', 'o', 'winning');
                });
                
                updateStatus();
                
                if (gameState.vsComputer && gameState.currentPlayer === 'o') {
                    makeComputerMove();
                }
            }

            // Update game status display
            function updateStatus() {
                if (gameState.gameOver) {
                    return;
                }
                
                status.innerHTML = `${gameState.currentPlayer.toUpperCase()}'s turn <span class="turn-indicator turn-${gameState.currentPlayer}"></span>`;
            }

            // Check for a win or draw
            function checkGameState() {
                // Check for a win
                for (const pattern of winPatterns) {
                    const [a, b, c] = pattern;
                    if (gameState.board[a] && gameState.board[a] === gameState.board[b] && gameState.board[a] === gameState.board[c]) {
                        gameState.gameOver = true;
                        highlightWinningCells(pattern);
                        gameState.scores[gameState.board[a]]++;
                        status.textContent = `${gameState.board[a].toUpperCase()} wins!`;
                        updateScoreDisplay();
                        return true;
                    }
                }

                // Check for a draw
                if (!gameState.board.includes('')) {
                    gameState.gameOver = true;
                    gameState.scores.ties++;
                    status.textContent = "It's a draw!";
                    updateScoreDisplay();
                    return true;
                }

                return false;
            }

            // Highlight winning cells
            function highlightWinningCells(pattern) {
                pattern.forEach(index => {
                    document.querySelector(`.cell[data-index="${index}"]`).classList.add('winning');
                });
            }

            // Update the score display
            function updateScoreDisplay() {
                scoreX.textContent = gameState.scores.x;
                scoreO.textContent = gameState.scores.o;
                scoreTies.textContent = gameState.scores.ties;
            }

            // Handle player move
            function handleCellClick(event) {
                const cell = event.target;
                const index = cell.dataset.index;

                // Check if the cell is already filled or game is over
                if (gameState.board[index] !== '' || gameState.gameOver) {
                    return;
                }

                // Update the game state and UI
                makeMove(index);

                // If game is not over and playing against computer, make computer move
                if (!gameState.gameOver && gameState.vsComputer) {
                    setTimeout(makeComputerMove, 500);
                }
            }

            // Make a move
            function makeMove(index) {
                gameState.board[index] = gameState.currentPlayer;
                const cell = document.querySelector(`.cell[data-index="${index}"]`);
                cell.textContent = gameState.currentPlayer.toUpperCase();
                cell.classList.add(gameState.currentPlayer);

                if (!checkGameState()) {
                    // Switch player
                    gameState.currentPlayer = gameState.currentPlayer === 'x' ? 'o' : 'x';
                    updateStatus();
                }
            }

            // Computer move logic
            function makeComputerMove() {
                if (gameState.gameOver) {
                    return;
                }

                let move;
                
                switch (gameState.difficulty) {
                    case 'easy':
                        move = getRandomMove();
                        break;
                    case 'medium':
                        // 50% chance to make optimal move
                        move = Math.random() < 0.5 ? getOptimalMove() : getRandomMove();
                        break;
                    case 'hard':
                        move = getOptimalMove();
                        break;
                    default:
                        move = getRandomMove();
                }

                if (move !== null) {
                    makeMove(move);
                }
            }

            // Get a random valid move
            function getRandomMove() {
                const emptyCells = gameState.board
                    .map((cell, index) => cell === '' ? index : null)
                    .filter(index => index !== null);
                
                if (emptyCells.length === 0) {
                    return null;
                }
                
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            // Get the optimal move using minimax algorithm
            function getOptimalMove() {
                // If board is empty, make a strategic first move
                if (gameState.board.every(cell => cell === '')) {
                    // Either center or corner
                    return Math.random() < 0.7 ? 4 : [0, 2, 6, 8][Math.floor(Math.random() * 4)];
                }
                
                // Check for immediate win
                let winMove = findWinningMove(gameState.currentPlayer);
                if (winMove !== null) {
                    return winMove;
                }
                
                // Block opponent's winning move
                let opponentPlayer = gameState.currentPlayer === 'x' ? 'o' : 'x';
                let blockMove = findWinningMove(opponentPlayer);
                if (blockMove !== null) {
                    return blockMove;
                }
                
                // For medium difficulty, sometimes make a random move instead
                if (gameState.difficulty === 'medium' && Math.random() < 0.3) {
                    return getRandomMove();
                }
                
                // Strategic moves
                // If center is open, take it
                if (gameState.board[4] === '') {
                    return 4;
                }
                
                // If opponent has center, try to take a corner
                const corners = [0, 2, 6, 8];
                const emptyCorners = corners.filter(index => gameState.board[index] === '');
                if (emptyCorners.length > 0) {
                    return emptyCorners[Math.floor(Math.random() * emptyCorners.length)];
                }
                
                // Take any empty side
                const sides = [1, 3, 5, 7];
                const emptySides = sides.filter(index => gameState.board[index] === '');
                if (emptySides.length > 0) {
                    return emptySides[Math.floor(Math.random() * emptySides.length)];
                }
                
                // Fallback to random move
                return getRandomMove();
            }
            
            // Find winning move for a player
            function findWinningMove(player) {
                for (let i = 0; i < gameState.board.length; i++) {
                    if (gameState.board[i] === '') {
                        // Try this move
                        gameState.board[i] = player;
                        
                        // Check if this is a winning move
                        const isWinningMove = winPatterns.some(pattern => {
                            const [a, b, c] = pattern;
                            return gameState.board[a] === player && 
                                   gameState.board[b] === player && 
                                   gameState.board[c] === player;
                        });
                        
                        // Undo the move
                        gameState.board[i] = '';
                        
                        if (isWinningMove) {
                            return i;
                        }
                    }
                }
                
                return null;
            }

            // Event Listeners
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });

            restartBtn.addEventListener('click', initGame);

            // Game mode buttons
            vsComputerBtn.addEventListener('click', () => {
                if (!gameState.vsComputer) {
                    gameState.vsComputer = true;
                    vsComputerBtn.classList.add('selected');
                    vsHumanBtn.classList.remove('selected');
                    difficultyDiv.style.display = 'block';
                    initGame();
                }
            });

            vsHumanBtn.addEventListener('click', () => {
                if (gameState.vsComputer) {
                    gameState.vsComputer = false;
                    vsHumanBtn.classList.add('selected');
                    vsComputerBtn.classList.remove('selected');
                    difficultyDiv.style.display = 'none';
                    initGame();
                }
            });

            // Difficulty buttons
            easyBtn.addEventListener('click', () => {
                gameState.difficulty = 'easy';
                easyBtn.classList.add('selected');
                mediumBtn.classList.remove('selected');
                hardBtn.classList.remove('selected');
                initGame();
            });

            mediumBtn.addEventListener('click', () => {
                gameState.difficulty = 'medium';
                mediumBtn.classList.add('selected');
                easyBtn.classList.remove('selected');
                hardBtn.classList.remove('selected');
                initGame();
            });

            hardBtn.addEventListener('click', () => {
                gameState.difficulty = 'hard';
                hardBtn.classList.add('selected');
                easyBtn.classList.remove('selected');
                mediumBtn.classList.remove('selected');
                initGame();
            });

            // Show difficulty selection for computer mode
            if (gameState.vsComputer) {
                difficultyDiv.style.display = 'block';
            }

            // Initialize the game
            initGame();
        });
    </script>
</body>
</html>
